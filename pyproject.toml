[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Enterprise AI Knowledge Assistant — RAG document Q&A"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "langchain", "openai", "knowledge-base", "fastapi"]

# Runtime (API) dependencies only.
dependencies = [
    # Web / API
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",

    # Config
    "python-dotenv",

    # Auth
    "pyjwt",
    "pwdlib[argon2]",

    # Database
    "sqlalchemy",
    "psycopg[binary]",

    # RAG stack
    "langchain",
    "langchain-classic",
    "langchain-core",
    "langchain-openai",
    "langchain-community",
    "langchain-chroma",
    "langchain-text-splitters",
    "chromadb",
    "pypdf",
    "openai",
]

[project.optional-dependencies]
ui = [
    "streamlit",
    "requests",
]
eval = [
    "ragas",
    "pandas",
    "datasets",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "httpx",          # required by FastAPI's TestClient
    "rapidfuzz",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]