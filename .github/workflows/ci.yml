name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # 3.10 = local dev, 3.12 = Docker image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock httpx rapidfuzz "ruff==0.17.1"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (offline, no real OpenAI, Chroma or Postgres)
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-knowledge-assistant:ci .